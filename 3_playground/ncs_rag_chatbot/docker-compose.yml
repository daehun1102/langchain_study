services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ncs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: pdf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ncs-network

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    container_name: ncs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI
    volumes:
      - redis_data:/data
    networks:
      - ncs-network

  # ── Arize Phoenix ──────────────────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ncs-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
    volumes:
      - phoenix_data:/phoenix/.phoenix
    networks:
      - ncs-network

  # ── AI Server (FastAPI) ────────────────────────────────────────────
  ai-server:
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    container_name: ncs-ai-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ncs-network

  # ── Backend (Spring Boot) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncs-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - ai-server
    networks:
      - ncs-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend (Vue3 Vite dev) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ncs-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - ncs-network

networks:
  ncs-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  phoenix_data:
