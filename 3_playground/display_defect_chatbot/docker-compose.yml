services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: defect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: defect_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - defect-network

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: defect-phoenix
    restart: unless-stopped
    ports:
      - "6007:6006"
      - "4318:4317"
    volumes:
      - phoenix_data:/phoenix/.phoenix
    networks:
      - defect-network

  ai-server:
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    container_name: defect-ai-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - defect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: defect-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      - ai-server
    networks:
      - defect-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: defect-frontend
    restart: unless-stopped
    ports:
      - "5175:5174"
    depends_on:
      - backend
    networks:
      - defect-network

networks:
  defect-network:
    driver: bridge

volumes:
  postgres_data:
  phoenix_data:
